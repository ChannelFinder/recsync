include:
  - docker/cf-compose.yml
services:
  recc:
    build: .
    depends_on:
      cf:
        condition: service_healthy
        restart: true
    healthcheck:
      # Ready means the TCP listener is open, which is what an IOC needs before
      # it can act on an announcement. RecCeiver binds a random port unless
      # bind is set, so match on the listening state instead of a port number.
      # Connecting to the port would register as an IOC connection and churn
      # the maxActive accounting on every probe.
      test: netstat -lnt | grep -q LISTEN
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      RECCEIVER_RECCEIVER_PROCS: cf
      RECCEIVER_RECCEIVER_LOGLEVEL: DEBUG
      RECCEIVER_CF_INFOTAGS: archive
      RECCEIVER_CF_ALIAS: TRUE
      RECCEIVER_CF_RECORDTYPE: TRUE
      RECCEIVER_CF_RECORDDESC: TRUE
      RECCEIVER_CF_CLEANONSTART: TRUE
      RECCEIVER_CF_USERNAME: admin
      RECCEIVER_CF_CFUSERNAME: admin
      RECCEIVER_CF_CFPASSWORD: password
      RECCEIVER_CF_BASEURL: http://cf:8080/ChannelFinder
      RECCEIVER_CF_VERIFYSSL: FALSE
    volumes:
      - type: bind
        source: docker/config/cf.conf
        target: /home/recceiver/channelfinderapi.conf
        read_only: true
    networks:
      - net-1-recc-1
      - net-2-cf

networks:
  net-1-recc-1:
    driver: bridge
